<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BG Перли - Генератор и Търсачка за Дестинации</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #10b981;
      --accent-hover: #059669;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 2rem;
      background: #020617;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent);
      text-decoration: none;
    }
    nav a {
      color: var(--text);
      text-decoration: none;
      margin-left: 1.5rem;
      font-weight: 500;
    }
    nav a.highlight {
      background: var(--accent);
      color: #000;
      padding: 0.5rem 1rem;
      border-radius: 6px;
    }
    .container {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* Филтри и Търсачка */
    .controls {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }
    .search-box {
      flex: 1 1 250px;
    }
    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #020617;
      border: 1px solid var(--border);
      color: white;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .filter-box {
      flex: 0 1 200px;
    }
    .filter-box select {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #020617;
      border: 1px solid var(--border);
      color: white;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    .random-btn {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: bold;
      color: #000;
      background-color: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    .random-btn:hover {
      background-color: var(--accent-hover);
    }

    /* Мрежа от дестинации */
    .places-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      min-height: 400px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }
    .card-img-wrapper {
      position: relative;
      cursor: pointer;
    }
    .destination-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background-color: #020617;
      display: block;
    }
    .view-more-badge {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      backdrop-filter: blur(4px);
    }
    .card-body {
      padding: 1.2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .category-badge {
      display: inline-block;
      background: #064e3b;
      color: #34d399;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      width: fit-content;
    }
    .card-title {
      margin: 0 0 0.3rem 0;
      font-size: 1.25rem;
      cursor: pointer;
    }
    .card-title:hover {
      color: var(--accent);
    }
    .card-location {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 0.8rem;
    }
    .card-desc {
      font-size: 0.95rem;
      line-height: 1.4;
      color: #cbd5e1;
      margin-bottom: 1rem;
      flex: 1;
    }

    /* Калкулатор с ръчни километри */
    .mini-calc {
      background: #020617;
      border: 1px solid var(--border);
      padding: 0.8rem;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .calc-inputs {
      display: flex;
      gap: 0.5rem;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .calc-field {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      flex: 1;
    }
    .calc-field label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .calc-field input {
      width: 100%;
      padding: 0.4rem;
      background: #1e293b;
      border: 1px solid #475569;
      color: white;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
      box-sizing: border-box;
    }
    .calc-result {
      font-weight: bold;
      color: var(--accent);
      text-align: center;
      margin-top: 0.4rem;
      border-top: 1px solid var(--border);
      padding-top: 0.4rem;
    }

    /* Бутон за Модал */
    .details-btn {
      width: 100%;
      margin-top: 0.8rem;
      padding: 0.5rem;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s, color 0.2s;
    }
    .details-btn:hover {
      background: var(--accent);
      color: #000;
    }

    /* Пагинация */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin: 2.5rem 0;
      flex-wrap: wrap;
    }
    .page-btn {
      padding: 0.5rem 1rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .page-btn:hover {
      background: var(--border);
    }
    .page-btn.active {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border-color: var(--accent);
    }
    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Pop-up (Modal) Стилове */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 1rem;
      box-sizing: border-box;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      padding: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: #020617;
      border: 1px solid var(--border);
      color: white;
      font-size: 1.2rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gallery-container {
      position: relative;
      margin-bottom: 1rem;
      border-radius: 8px;
      overflow: hidden;
      background: #020617;
    }
    .gallery-img {
      width: 100%;
      height: 350px;
      object-fit: cover;
      display: block;
    }
    .gallery-nav {
      position: absolute;
      top: 50%;
      width: 100%;
      display: flex;
      justify-content: space-between;
      transform: translateY(-50%);
      padding: 0 0.5rem;
      box-sizing: border-box;
    }
    .gallery-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border);
      color: white;
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      backdrop-filter: blur(4px);
    }
    .gallery-btn:hover {
      background: var(--accent);
      color: #000;
    }
    .gallery-counter {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-size: 0.8rem;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">BGПерли 🌲</a>
    <nav>
      <a href="index.html">Дестинации</a>
      <a href="salary.html" class="highlight">Калкулатор Заплата</a>
    </nav>
  </header>

  <div class="container">
    
    <!-- Филтри и Търсачка -->
    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Търси дестинация или градове..." oninput="onFilterChange()">
      </div>
      <div class="filter-box">
        <select id="categoryFilter" onchange="onFilterChange()">
          <option value="all">Всички категории</option>
          <option value="waterfall">Водопади</option>
          <option value="cave">Пещери</option>
          <option value="history">Манастири & История</option>
          <option value="mountain">Планини & Върхове</option>
          <option value="sea">Езера & Море</option>
        </select>
      </div>
      <button class="random-btn" onclick="pickRandom()">🎲 Случайна дестинация</button>
    </div>

    <!-- Мрежа от дестинации -->
    <div class="places-grid" id="placesContainer"></div>

    <!-- Страници / Пагинация -->
    <div class="pagination" id="paginationContainer"></div>

  </div>

  <!-- Pop-up (Модален прозорец) за детайли и галерия -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      
      <div class="gallery-container">
        <img id="modalImg" src="" class="gallery-img" alt="Дестинация">
        <div class="gallery-nav">
          <button class="gallery-btn" onclick="prevImage()">❮</button>
          <button class="gallery-btn" onclick="nextImage()">❯</button>
        </div>
        <div class="gallery-counter" id="galleryCounter">1 / 3</div>
      </div>

      <span class="category-badge" id="modalCategory">Категория</span>
      <h2 id="modalTitle" style="margin: 0.5rem 0 0.2rem 0;">Заглавие</h2>
      <div id="modalLocation" class="card-location">📍 Локация</div>
      <p id="modalDesc" style="line-height: 1.5; color: #cbd5e1;"></p>

      <div class="mini-calc" style="margin-top: 1rem;">
        <div class="calc-inputs">
          <div class="calc-field">
            <label>КМ (двупосочно):</label>
            <input type="number" id="modalKm" value="200" min="1" oninput="updateModalCost()">
          </div>
          <div class="calc-field">
            <label>Брой хора:</label>
            <input type="number" id="modalPeople" value="3" min="1" oninput="updateModalCost()">
          </div>
        </div>
        <div class="calc-result" id="modalCost"> Изчисляване... </div>
      </div>
    </div>
  </div>

  <script>
    // Резервно изображение при проблем със зареждането
    const FALLBACK_IMG = "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80";

    // Списък със забележителности и галерии от снимки
    const placesData = [
      {
        id: 1,
        title: "Рилски Манастир",
        location: "Рила планина",
        category: "history",
        km: 240,
        images: [
          "https://images.unsplash.com/photo-1598899134739-24c46f58b8c0?auto=format&fit=crop&w=800&q=80",
          "https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=800&q=80",
          "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80"
        ],
        desc: "Най-големият и известен православен манастир в България, основан през X век от св. Иван Рилски. Включен в списъка на ЮНЕСКО."
      },
      {
        id: 2,
        title: "Белоградчишки скали & Крепост",
        location: "Белоградчик",
        category: "history",
        km: 430,
        images: [
          "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80",
          "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=80"
        ],
        desc: "Уникални природни скални фигури, формирани в продължение на 200 милиона години, комбинирани с антична и средновековна крепост."
      },
      {
        id: 3,
        title: "Царевец",
        location: "Велико Търново",
        category: "history",
        km: 440,
        images: [
          "https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?auto=format&fit=crop&w=800&q=80",
          "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=800&q=80"
        ],
        desc: "Непревземаемата крепост на Второто българско царство с Патриаршеската катедрала и кулата на Балдуин."
      },
      {
        id: 4,
        title: "Седемте Рила Езера",
        location: "Рила планина",
        category: "sea",
        km: 190,
        images: [
          "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80",
          "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=800&q=80"
        ],
        desc: "Група езера с ледников произход в Рила: Сълзата, Окото, Бъбрека, Близнака, Трилистника, Рибното и Долното езеро."
      },
      {
        id: 5,
        title: "Крушунски водопади",
        location: "с. Крушуна • Летница",
        category: "waterfall",
        km: 310,
        images: [
          "https://images.unsplash.com/photo-1432405972618-c60b0225b8f9?auto=format&fit=crop&w=800&q=80",
          "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80"
        ],
        desc: "Приказна водна каскада от естествени бигорни прагове с екзотични тюркоазено сини басейни."
      },
      {
        id: 6,
        title: "Пещера Проходна (Очите на Бога)",
        location: "Карлуково",
        category: "cave",
        km: 230,
        images: [
          "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80",
          "https://images.unsplash.com/photo-1509114397022-ed747cca3f65?auto=format&fit=crop&w=800&q=80"
        ],
        desc: "Една от най-известните пещери в България с два естествени скални отвора в тавана, наподобяващи човешки очи."
      }
    ];

    // Допълнителни дестинации
    function generateExtraPlaces() {
      const extra = [];
      const titles = [
        "Дяволски мост", "Бачковски манастир", "Античен театър Пловдив", "Перперикон", "Връх Мусала",
        "Връх Вихрен", "Дяволското гърло", "Ягодинска пещера", "Пещера Деветашка", "Замъкът Равадиново",
        "Нос Калиакра", "Побити камъни", "Връх Ботев", "Чудните мостове", "Водопад Райско пръскало"
      ];
      const cats = ["history", "mountain", "cave", "sea", "waterfall"];

      titles.forEach((t, i) => {
        extra.push({
          id: i + 10,
          title: t,
          location: "България",
          category: cats[i % cats.length],
          km: 150 + (i * 20),
          images: [
            "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=80"
          ],
          desc: `Красива дестинация (${t}), предлагаща уникални природни гледки и богати възможности за туризъм.`
        });
      });
      return extra;
    }

    const allPlaces = [...placesData, ...generateExtraPlaces()];

    // Променливи за състоянието
    let currentPage = 1;
    const itemsPerPage = 6;
    let currentFilteredList = [...allPlaces];
    
    // Модал променливи
    let activeModalPlace = null;
    let currentImgIndex = 0;

    // Рендериране на страниците
    function renderCurrentPage() {
      const container = document.getElementById('placesContainer');
      container.innerHTML = '';

      if (currentFilteredList.length === 0) {
        container.innerHTML = `<div class="no-results">❌ Няма намерени дестинации.</div>`;
        document.getElementById('paginationContainer').innerHTML = '';
        return;
      }

      const startIndex = (currentPage - 1) * itemsPerPage;
      const pageItems = currentFilteredList.slice(startIndex, startIndex + itemsPerPage);

      pageItems.forEach((place, pageIndex) => {
        const globalIndex = startIndex + pageIndex;
        const card = document.createElement('div');
        card.className = 'card';

        let catText = "Дестинация";
        if(place.category === "waterfall") catText = "💧 Водопад";
        if(place.category === "cave") catText = "🦇 Пещера";
        if(place.category === "history") catText = "🏰 История & Манастир";
        if(place.category === "mountain") catText = "⛰️ Планина";
        if(place.category === "sea") catText = "🌊 Море & Езеро";

        const mainImg = place.images && place.images[0] ? place.images[0] : FALLBACK_IMG;

        card.innerHTML = `
          <div class="card-img-wrapper" onclick="openModal(${globalIndex})">
            <img src="${mainImg}" alt="${place.title}" class="destination-img" onerror="this.src='${FALLBACK_IMG}'">
            <span class="view-more-badge">🖼️ Галерия (${place.images.length})</span>
          </div>
          <div class="card-body">
            <span class="category-badge">${catText}</span>
            <h3 class="card-title" onclick="openModal(${globalIndex})">${place.title}</h3>
            <div class="card-location">📍 ${place.location}</div>
            <div class="card-desc">${place.desc}</div>
            
            <div class="mini-calc">
              <div class="calc-inputs">
                <div class="calc-field">
                  <label>КМ (двупосочно):</label>
                  <input type="number" id="km_input_${globalIndex}" value="${place.km}" min="1" oninput="updateCardCost(${globalIndex})">
                </div>
                <div class="calc-field">
                  <label>Хора:</label>
                  <input type="number" id="people_input_${globalIndex}" value="3" min="1" oninput="updateCardCost(${globalIndex})">
                </div>
              </div>
              <div class="calc-result" id="cost_result_${globalIndex}">0.00 лв.</div>
            </div>

            <button class="details-btn" onclick="openModal(${globalIndex})">🔍 Виж повече & Снимки</button>
          </div>
        `;
        container.appendChild(card);
        updateCardCost(globalIndex);
      });

      renderPaginationControls();
    }

    // Калкулация на цена по карти
    function updateCardCost(globalIndex) {
      const kmInput = document.getElementById(`km_input_${globalIndex}`);
      const peopleInput = document.getElementById(`people_input_${globalIndex}`);
      const resultDiv = document.getElementById(`cost_result_${globalIndex}`);

      if (!kmInput || !peopleInput || !resultDiv) return;

      const km = parseFloat(kmInput.value) || 0;
      const people = parseInt(peopleInput.value) || 1;

      const consumption = 7.0; // 7 литра на 100 км
      const fuelPrice = 2.65;  // 2.65 лв./литър

      const totalCost = (km / 100) * consumption * fuelPrice;
      const costPerPerson = totalCost / people;

      resultDiv.innerHTML = `Общо: <strong>${totalCost.toFixed(2)} лв.</strong> (${costPerPerson.toFixed(2)} лв./човек)`;
    }

    // Бутони за страници
    function renderPaginationControls() {
      const container = document.getElementById('paginationContainer');
      container.innerHTML = '';

      const totalPages = Math.ceil(currentFilteredList.length / itemsPerPage);
      if (totalPages <= 1) return;

      const prevBtn = document.createElement('button');
      prevBtn.className = 'page-btn';
      prevBtn.innerText = '← Предишна';
      prevBtn.disabled = currentPage === 1;
      prevBtn.onclick = () => {
        if (currentPage > 1) {
          currentPage--;
          renderCurrentPage();
          window.scrollTo({ top: 250, behavior: 'smooth' });
        }
      };
      container.appendChild(prevBtn);

      for (let i = 1; i <= totalPages; i++) {
        const pageBtn = document.createElement('button');
        pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        pageBtn.innerText = i;
        pageBtn.onclick = () => {
          currentPage = i;
          renderCurrentPage();
          window.scrollTo({ top: 250, behavior: 'smooth' });
        };
        container.appendChild(pageBtn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.className = 'page-btn';
      nextBtn.innerText = 'Следваща →';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.onclick = () => {
        if (currentPage < totalPages) {
          currentPage++;
          renderCurrentPage();
          window.scrollTo({ top: 250, behavior: 'smooth' });
        }
      };
      container.appendChild(nextBtn);
    }

    // Филтриране
    function onFilterChange() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const category = document.getElementById('categoryFilter').value;

      currentFilteredList = allPlaces.filter(place => {
        const matchesSearch = place.title.toLowerCase().includes(search) || place.location.toLowerCase().includes(search);
        const matchesCat = category === 'all' || place.category === category;
        return matchesSearch && matchesCat;
      });

      currentPage = 1;
      renderCurrentPage();
    }

    // Случаен избор
    function pickRandom() {
      if(currentFilteredList.length === 0) return;
      const randomIndex = Math.floor(Math.random() * currentFilteredList.length);
      openModal(randomIndex);
    }

    // --- POP-UP (MODAL) И ГАЛЕРИЯ ---
    function openModal(globalIndex) {
      activeModalPlace = currentFilteredList[globalIndex];
      if (!activeModalPlace) return;

      currentImgIndex = 0;
      
      document.getElementById('modalTitle').innerText = activeModalPlace.title;
      document.getElementById('modalLocation').innerText = `📍 ${activeModalPlace.location}`;
      document.getElementById('modalDesc').innerText = activeModalPlace.desc;
      document.getElementById('modalCategory').innerText = activeModalPlace.category.toUpperCase();
      
      // Поставяме километрите
      const cardKmInput = document.getElementById(`km_input_${globalIndex}`);
      const currentKm = cardKmInput ? cardKmInput.value : activeModalPlace.km;
      document.getElementById('modalKm').value = currentKm;

      updateModalImage();
      updateModalCost();

      document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
    }

    function updateModalImage() {
      if (!activeModalPlace || !activeModalPlace.images.length) return;
      const imgElem = document.getElementById('modalImg');
      imgElem.src = activeModalPlace.images[currentImgIndex];
      imgElem.onerror = () => { imgElem.src = FALLBACK_IMG; };

      document.getElementById('galleryCounter').innerText = `${currentImgIndex + 1} / ${activeModalPlace.images.length}`;
    }

    function nextImage() {
      if (!activeModalPlace) return;
      currentImgIndex = (currentImgIndex + 1) % activeModalPlace.images.length;
      updateModalImage();
    }

    function prevImage() {
      if (!activeModalPlace) return;
      currentImgIndex = (currentImgIndex - 1 + activeModalPlace.images.length) % activeModalPlace.images.length;
      updateModalImage();
    }

    function updateModalCost() {
      const km = parseFloat(document.getElementById('modalKm').value) || 0;
      const people = parseInt(document.getElementById('modalPeople').value) || 1;

      const totalCost = (km / 100) * 7.0 * 2.65;
      const costPerPerson = totalCost / people;

      document.getElementById('modalCost').innerHTML = `Общо: <strong>${totalCost.toFixed(2)} лв.</strong> (${costPerPerson.toFixed(2)} лв./човек)`;
    }

    // Затваряне при клик извън съдържанието
    window.onclick = function(event) {
      const modal = document.getElementById('modalOverlay');
      if (event.target === modal) {
        closeModal();
      }
    };

    // Първоначално зареждане
    renderCurrentPage();
  </script>
</body>
</html>
