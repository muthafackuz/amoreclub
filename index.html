<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BG Перли - Генератор и Търсачка за Дестинации</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #10b981;
      --accent-hover: #059669;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 2rem;
      background: #020617;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent);
      text-decoration: none;
    }
    nav a {
      color: var(--text);
      text-decoration: none;
      margin-left: 1.5rem;
      font-weight: 500;
    }
    nav a.highlight {
      background: var(--accent);
      color: #000;
      padding: 0.5rem 1rem;
      border-radius: 6px;
    }
    .container {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* Филтри и Търсачка */
    .controls {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }
    .search-box {
      flex: 1 1 250px;
    }
    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #020617;
      border: 1px solid var(--border);
      color: white;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .filter-box {
      flex: 0 1 200px;
    }
    .filter-box select {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #020617;
      border: 1px solid var(--border);
      color: white;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    .random-btn {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: bold;
      color: #000;
      background-color: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    .random-btn:hover {
      background-color: var(--accent-hover);
    }

    /* Мрежа от дестинации */
    .places-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      min-height: 400px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .destination-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background-color: #020617;
    }
    .card-body {
      padding: 1.2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .category-badge {
      display: inline-block;
      background: #064e3b;
      color: #34d399;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      width: fit-content;
    }
    .card-title {
      margin: 0 0 0.3rem 0;
      font-size: 1.25rem;
    }
    .card-location {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 0.8rem;
    }
    .card-desc {
      font-size: 0.95rem;
      line-height: 1.4;
      color: #cbd5e1;
      margin-bottom: 1rem;
      flex: 1;
    }

    /* Мини калкулатор */
    .mini-calc {
      background: #020617;
      border: 1px solid var(--border);
      padding: 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .mini-calc input {
      width: 60px;
      padding: 0.2rem;
      background: #1e293b;
      border: 1px solid #475569;
      color: white;
      border-radius: 4px;
      text-align: center;
    }
    .calc-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
    }
    .calc-result {
      font-weight: bold;
      color: var(--accent);
      text-align: center;
      margin-top: 0.5rem;
      border-top: 1px solid var(--border);
      padding-top: 0.4rem;
    }

    /* Пагинация */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin: 2.5rem 0;
      flex-wrap: wrap;
    }
    .page-btn {
      padding: 0.5rem 1rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .page-btn:hover {
      background: var(--border);
    }
    .page-btn.active {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border-color: var(--accent);
    }
    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-size: 1.2rem;
    }
  </style>
</head>

        "Връх Руен", "Връх Ком", "Връх Мальовица", "Урдини езера", "Попово езеро", "Сини камъни Сливен",
        "Карандила", "Жребчево и потопената църква", "Каменните гъби", "Скали Враттата", "Каньон Емен",
        "Хотнишка екопътека", "Двореца Балчик", "Ботаническа градина Балчик", "Остров Света Анастасия",
        "Белославско езеро", "Шабленски фар", "Дуранкулашко езеро", "Аркутино", "Бегликташ",
        "Заповедник Ропотамо", "Крепост Устра", "Крепост Моняк", "Връх Снежанка", "Орлово око",
        "Вълчи камък", "Триградско ждрело", "Буйновско ждрело", "Златоград - стария град",
        "Перущица", "Клисура", "Копривщица", "Панагюрище", "Свещарска гробница", "Деветашка пещера",
        "Крепост Хоталич", "Цари Мали град", "Плиска - Голямата базилика", "Манастир Седемте престола",
        "Водопад Сухата река", "Скалните прозорци", "Стобски пирамиди", "Кресненско ждрело",
        "Пирински езера", "Екопътека Бордо", "Водопад Боров камък", "Пещера Моровица", "Пещера Извора"
      ];

      for (let i = 0; i < names.length; i++) {
        const cat = catList[i % catList.length];
        const reg = regions[i % regions.length];
        extraPlaces.push({
          title: names[i],
          location: `${reg}`,
          category: cat,
          km: Math.floor(Math.random() * 400) + 50,
          img: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80",
          desc: `Изключителна дестинация в региона на ${reg}. Перфектно място за уикенд разходка и фотосесии.`
        });
      }
      return extraPlaces;
    }

    const allPlaces = [...placesData, ...generateExtraPlaces()];

    // ПАГИНАЦИЯ ПРОМЕНЛИВИ
    let currentPage = 1;
    const itemsPerPage = 6; // По 6 на страница!
    let currentFilteredList = [...allPlaces];

    // Рендериране на картите за текущата страница
    function renderCurrentPage() {
      const container = document.getElementById('placesContainer');
      container.innerHTML = '';

      if (currentFilteredList.length === 0) {
        container.innerHTML = `<div class="no-results">❌ Няма намерени дестинации по вашите критерии.</div>`;
        document.getElementById('paginationContainer').innerHTML = '';
        return;
      }

      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const pageItems = currentFilteredList.slice(startIndex, endIndex);

      pageItems.forEach((place, index) => {
        const card = document.createElement('div');
        card.className = 'card';

        let catText = "Дестинация";
        if(place.category === "waterfall") catText = "💧 Водопад";
        if(place.category === "cave") catText = "🦇 Пещера";
        if(place.category === "history") catText = "🏰 История & Манастир";
        if(place.category === "mountain") catText = "⛰️ Планина";
        if(place.category === "sea") catText = "🌊 Море & Езеро";

        card.innerHTML = `
          <img src="${place.img}" alt="${place.title}" class="destination-img" onerror="this.src='https://via.placeholder.com/800x500?text=${encodeURIComponent(place.title)}'">
          <div class="card-body">
            <span class="category-badge">${catText}</span>
            <h3 class="card-title">${place.title}</h3>
            <div class="card-location">📍 ${place.location}</div>
            <div class="card-desc">${place.desc}</div>
            
            <div class="mini-calc">
              <div class="calc-row">
                <span>Двупосочно: <strong>${place.km} км</strong></span>
                <span>Хора: <input type="number" id="people_${index}" value="3" min="1" oninput="updateCardCost(${index}, ${place.km})"></span>
              </div>
              <div class="calc-result" id="cost_${index}"> Loading... </div>
            </div>
          </div>
        `;
        container.appendChild(card);
        updateCardCost(index, place.km);
      });

      renderPaginationControls();
    }

    // Изчертаване на бутоните за страници
    function renderPaginationControls() {
      const container = document.getElementById('paginationContainer');
      container.innerHTML = '';

      const totalPages = Math.ceil(currentFilteredList.length / itemsPerPage);
      if (totalPages <= 1) return;

      // Бутон "Предишна"
      const prevBtn = document.createElement('button');
      prevBtn.className = 'page-btn';
      prevBtn.innerText = '← Предишна';
      prevBtn.disabled = currentPage === 1;
      prevBtn.onclick = () => {
        if (currentPage > 1) {
          currentPage--;
          renderCurrentPage();
          window.scrollTo({ top: 300, behavior: 'smooth' });
        }
      };
      container.appendChild(prevBtn);

      // Номера на страници
      for (let i = 1; i <= totalPages; i++) {
        const pageBtn = document.createElement('button');
        pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        pageBtn.innerText = i;
        pageBtn.onclick = () => {
          currentPage = i;
          renderCurrentPage();
          window.scrollTo({ top: 300, behavior: 'smooth' });
        };
        container.appendChild(pageBtn);
      }

      // Бутон "Следваща"
      const nextBtn = document.createElement('button');
      nextBtn.className = 'page-btn';
      nextBtn.innerText = 'Следваща →';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.onclick = () => {
        if (currentPage < totalPages) {
          currentPage++;
          renderCurrentPage();
          window.scrollTo({ top: 300, behavior: 'smooth' });
        }
      };
      container.appendChild(nextBtn);
    }

    // Калкулатор за разход на всяка карта
    function updateCardCost(index, km) {
      const peopleInput = document.getElementById(`people_${index}`);
      const costDiv = document.getElementById(`cost_${index}`);
      
      const people = parseInt(peopleInput.value) || 1;
      const consumption = 7.0; // 7L / 100km
      const price = 2.65; // 2.65 лв / л

      const totalLiters = (km / 100) * consumption;
      const totalCost = totalLiters * price;
      const costPerPerson = totalCost / people;

      costDiv.innerHTML = `Общо: <strong>${totalCost.toFixed(2)} лв.</strong> (${costPerPerson.toFixed(2)} лв./човек)`;
    }

    // Събитие при промяна на търсачката или категорията
    function onFilterChange() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const category = document.getElementById('categoryFilter').value;

      currentFilteredList = allPlaces.filter(place => {
        const matchesSearch = place.title.toLowerCase().includes(search) || place.location.toLowerCase().includes(search);
        const matchesCat = category === 'all' || place.category === category;
        return matchesSearch && matchesCat;
      });

      currentPage = 1; // Нулираме до Страница 1
      renderCurrentPage();
    }

    // Случаен избор
    function pickRandom() {
      if(currentFilteredList.length === 0) return;

      const randomIndex = Math.floor(Math.random() * currentFilteredList.length);
      currentPage = Math.floor(randomIndex / itemsPerPage) + 1;
      
      renderCurrentPage();
      window.scrollTo({ top: 300, behavior: 'smooth' });
    }

    // Първоначално зареждане
    renderCurrentPage();
  </script>
</body>
</html>
