<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BG Перли - Генератор на Дестинации</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #10b981;
      --accent-hover: #059669;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      background: #020617;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent);
      text-decoration: none;
    }
    nav a {
      color: var(--text);
      text-decoration: none;
      margin-left: 1.5rem;
      font-weight: 500;
    }
    nav a.highlight {
      background: var(--accent);
      color: #000;
      padding: 0.5rem 1rem;
      border-radius: 6px;
    }
    .container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .generator-btn {
      display: block;
      width: 100%;
      padding: 1.2rem;
      font-size: 1.3rem;
      font-weight: bold;
      color: #000;
      background-color: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 2rem;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }
    .generator-btn:hover {
      background-color: var(--accent-hover);
    }
    .generator-btn:active {
      transform: scale(0.98);
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid var(--border);
      transition: opacity 0.3s ease-in-out;
    }
    .destination-img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 1rem;
      background-color: #020617;
      display: block;
    }
    .calculator {
      background: #020617;
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 1.5rem;
      margin-top: 1.5rem;
    }
    .calculator h3 {
      margin-top: 0;
      color: var(--accent);
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
      color: var(--text-muted);
    }
    input {
      width: 100%;
      padding: 0.6rem;
      background: #1e293b;
      border: 1px solid #475569;
      color: white;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .result {
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 1rem;
      padding: 1rem;
      background: #064e3b;
      border-radius: 6px;
      text-align: center;
      color: #34d399;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">BGПерли 🌲</a>
    <nav>
      <a href="index.html">Дестинации</a>
      <a href="salary.html" class="highlight">Калкулатор Заплата</a>
    </nav>
  </header>

  <div class="container">
    <button class="generator-btn" onclick="generateRandomPlace()">🎲 ГЕНЕРИРАЙ СЛЕДВАЩА ДЕСТИНАЦИЯ</button>

    <div class="card" id="placeCard">
      <h2 id="placeTitle">Зареждане...</h2>
      <p id="placeLocation" style="color: var(--text-muted);"></p>
      
      <img id="placeImg" src="" alt="Дестинация" class="destination-img">
      
      <p id="placeDesc"></p>

      <div class="calculator">
        <h3>🚗 Калкулатор за това пътуване</h3>
        
        <div class="form-group">
          <label>Приблиз. разстояние в двете посоки (км):</label>
          <input type="number" id="distance" value="120">
        </div>

        <div class="form-group">
          <label>Разход на колата (л/100км):</label>
          <input type="number" id="consumption" value="7" step="0.1">
        </div>

        <div class="form-group">
          <label>Цена на горивото (лв/литър):</label>
          <input type="number" id="price" value="2.65" step="0.01">
        </div>

        <div class="form-group">
          <label>Брой хора в колата:</label>
          <input type="number" id="people" value="3">
        </div>

        <div class="result" id="totalResult">
          Общо за гориво: 0.00 лв.
        </div>
      </div>
    </div>
  </div>

  <script>
    // Илюстрации, внедрени директно в кода (100% гаранция за показване)
    const svgWaterfall = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='500' viewBox='0 0 800 500'><rect width='800' height='500' fill='%230f172a'/><path d='M150 500 L300 150 L450 500' fill='%231e293b'/><path d='M350 500 L550 100 L750 500' fill='%23334155'/><path d='M380 120 L370 500 L420 500 L400 120 Z' fill='%2338bdf8' opacity='0.8'/><circle cx='400' cy='60' r='40' fill='%23fef08a'/></svg>";
    const svgLakes = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='500' viewBox='0 0 800 500'><rect width='800' height='500' fill='%23020617'/><path d='M0 500 L200 200 L400 500' fill='%231e293b'/><path d='M300 500 L550 150 L800 500' fill='%230f172a'/><ellipse cx='400' cy='380' rx='250' ry='70' fill='%230284c7'/><ellipse cx='250' cy='280' rx='120' ry='35' fill='%2338bdf8'/></svg>";
    const svgBridge = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='500' viewBox='0 0 800 500'><rect width='800' height='500' fill='%230f172a'/><rect y='350' width='800' height='150' fill='%230369a1'/><path d='M100 350 Q 400 150 700 350 L 700 380 Q 400 220 100 380 Z' fill='%23475569'/><path d='M 250 350 A 150 150 0 0 1 550 350' fill='%230369a1'/></svg>";
    const svgCave = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='500' viewBox='0 0 800 500'><rect width='800' height='500' fill='%231e293b'/><ellipse cx='280' cy='200' rx='80' ry='120' fill='%23fef08a' opacity='0.9'/><ellipse cx='520' cy='200' rx='80' ry='120' fill='%23fef08a' opacity='0.9'/><path d='M 0 0 L 800 0 L 800 500 L 0 500 Z M 280 80 A 100 140 0 0 0 280 320 A 100 140 0 0 0 280 80 M 520 80 A 100 140 0 0 0 520 320 A 100 140 0 0 0 520 80' fill='%23020617'/></svg>";
    const svgRocks = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='500' viewBox='0 0 800 500'><rect width='800' height='500' fill='%230c4a6e'/><path d='M 100 500 L 150 180 L 220 500' fill='%239a3412'/><path d='M 250 500 L 320 120 L 400 500' fill='%23c2410c'/><path d='M 450 500 L 520 220 L 600 500' fill='%239a3412'/><path d='M 620 500 L 680 150 L 760 500' fill='%23ea580c'/></svg>";
    const svgMonastery = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='500' viewBox='0 0 800 500'><rect width='800' height='500' fill='%230f172a'/><rect x='250' y='200' width='300' height='200' fill='%23f8fafc'/><path d='M 230 200 L 400 80 L 570 200 Z' fill='%23991b1b'/><rect x='360' y='280' width='80' height='120' fill='%23451a03'/><path d='M 380 40 L 420 40 M 400 20 L 400 60' stroke='%23fef08a' stroke-width='8'/></svg>";

    const places = [
      {
        title: "Вазовска Екопътека и водопад Скакля",
        location: "Искърско дефиле • Стара планина",
        img: svgWaterfall,
        desc: "Един от най-живописните преходи в района с изумителна гледка към скалите и високия водопад.",
        km: 120
      },
      {
        title: "Седемте Рила Езера",
        location: "Рила планина • Паничище",
        img: svgLakes,
        desc: "Най-известната езерна група в България, разположена в красив циркус в Рила планина.",
        km: 190
      },
      {
        title: "Дяволският мост",
        location: "Родопи • гр. Ардино",
        img: svgBridge,
        desc: "Мистичен средновековен мост над река Арда, заобиколен от невероятна родопска природа.",
        km: 520
      },
      {
        title: "Пещера Проходна (Очите на Бога)",
        location: "Карлуково • Луковит",
        img: svgCave,
        desc: "Известна пещера с два огромни естествени скални отвора, наподобяващи човешки очи.",
        km: 230
      },
      {
        title: "Белоградчишки Скали",
        location: "Белоградчик • Северозападна България",
        img: svgRocks,
        desc: "Уникални червеникави скални образувания с богата история и средновековна крепост.",
        km: 430
      },
      {
        title: "Рилски Манастир",
        location: "Рила планина",
        img: svgMonastery,
        desc: "Най-големият и известен православен манастир в България, част от световното наследство на ЮНЕСКО.",
        km: 240
      }
    ];

    let currentIndex = -1;

    function generateRandomPlace() {
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * places.length);
      } while (newIndex === currentIndex);

      currentIndex = newIndex;
      const place = places[currentIndex];

      document.getElementById('placeTitle').innerText = place.title;
      document.getElementById('placeLocation').innerText = place.location;
      document.getElementById('placeImg').src = place.img;
      document.getElementById('placeDesc').innerText = place.desc;
      document.getElementById('distance').value = place.km;

      calculateFuel();
    }

    const distanceInput = document.getElementById('distance');
    const consumptionInput = document.getElementById('consumption');
    const priceInput = document.getElementById('price');
    const peopleInput = document.getElementById('people');
    const resultDiv = document.getElementById('totalResult');

    function calculateFuel() {
      const dist = parseFloat(distanceInput.value) || 0;
      const cons = parseFloat(consumptionInput.value) || 0;
      const price = parseFloat(priceInput.value) || 0;
      const people = parseInt(peopleInput.value) || 1;

      const totalLiters = (dist / 100) * cons;
      const totalCost = totalLiters * price;
      const costPerPerson = totalCost / people;

      resultDiv.innerHTML = `Общо за гориво: ${totalCost.toFixed(2)} лв. (${costPerPerson.toFixed(2)} лв. на човек)`;
    }

    distanceInput.addEventListener('input', calculateFuel);
    consumptionInput.addEventListener('input', calculateFuel);
    priceInput.addEventListener('input', calculateFuel);
    peopleInput.addEventListener('input', calculateFuel);

    generateRandomPlace();
  </script>
</body>
</html>
