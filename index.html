<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BG Перли - Генератор на Дестинации</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #10b981;
      --accent-hover: #059669;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      background: #020617;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent);
      text-decoration: none;
    }
    nav a {
      color: var(--text);
      text-decoration: none;
      margin-left: 1.5rem;
      font-weight: 500;
    }
    nav a.highlight {
      background: var(--accent);
      color: #000;
      padding: 0.5rem 1rem;
      border-radius: 6px;
    }
    .container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .generator-btn {
      display: block;
      width: 100%;
      padding: 1.2rem;
      font-size: 1.3rem;
      font-weight: bold;
      color: #000;
      background-color: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 2rem;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }
    .generator-btn:hover {
      background-color: var(--accent-hover);
    }
    .generator-btn:active {
      transform: scale(0.98);
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid var(--border);
      transition: opacity 0.3s ease-in-out;
    }
    .destination-img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 1rem;
      background-color: #020617;
      display: block;
    }
    .calculator {
      background: #020617;
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 1.5rem;
      margin-top: 1.5rem;
    }
    .calculator h3 {
      margin-top: 0;
      color: var(--accent);
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
      color: var(--text-muted);
    }
    input {
      width: 100%;
      padding: 0.6rem;
      background: #1e293b;
      border: 1px solid #475569;
      color: white;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .result {
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 1rem;
      padding: 1rem;
      background: #064e3b;
      border-radius: 6px;
      text-align: center;
      color: #34d399;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">BGПерли 🌲</a>
    <nav>
      <a href="index.html">Дестинации</a>
      <a href="salary.html" class="highlight">Калкулатор Заплата</a>
    </nav>
  </header>

  <div class="container">
    <button class="generator-btn" onclick="generateRandomPlace()">🎲 ГЕНЕРИРАЙ СЛЕДВАЩА ДЕСТИНАЦИЯ</button>

    <div class="card" id="placeCard">
      <h2 id="placeTitle">Зареждане...</h2>
      <p id="placeLocation" style="color: var(--text-muted);"></p>
      
      <img id="placeImg" src="" alt="Дестинация" class="destination-img">
      
      <p id="placeDesc"></p>

      <div class="calculator">
        <h3>🚗 Калкулатор за това пътуване</h3>
        
        <div class="form-group">
          <label>Приблиз. разстояние в двете посоки (км):</label>
          <input type="number" id="distance" value="120">
        </div>

        <div class="form-group">
          <label>Разход на колата (л/100км):</label>
          <input type="number" id="consumption" value="7" step="0.1">
        </div>

        <div class="form-group">
          <label>Цена на горивото (лв/литър):</label>
          <input type="number" id="price" value="2.65" step="0.01">
        </div>

        <div class="form-group">
          <label>Брой хора в колата:</label>
          <input type="number" id="people" value="3">
        </div>

        <div class="result" id="totalResult">
          Общо за гориво: 0.00 лв.
        </div>
      </div>
    </div>
  </div>

  <script>
    const places = [
      {
        title: "Вазовска Екопътека и водопад Скакля",
        location: "Искърско дефиле • Стара планина",
        img: "https://picsum.photos/id/1015/800/500",
        desc: "Един от най-живописните преходи в района с изумителна гледка към скалите и водопада.",
        km: 120
      },
      {
        title: "Седемте Рила Езера",
        location: "Рила планина • Паничище",
        img: "https://picsum.photos/id/1018/800/500",
        desc: "Най-известната езерна група в България, разположена в красив планински циркус.",
        km: 190
      },
      {
        title: "Дяволският мост",
        location: "Родопи • гр. Ардино",
        img: "https://picsum.photos/id/1028/800/500",
        desc: "Мистичен средновековен мост над река Арда, заобиколен от невероятна природа.",
        km: 520
      },
      {
        title: "Пещера Проходна (Очите на Бога)",
        location: "Карлуково • Луковит",
        img: "https://picsum.photos/id/1036/800/500",
        desc: "Известна пещера с два огромни естествени скални отвора, наподобяващи човешки очи.",
        km: 230
      },
      {
        title: "Белоградчишки Скали",
        location: "Белоградчик • Северозападна България",
        img: "https://picsum.photos/id/1043/800/500",
        desc: "Уникални червеникави скални образувания с богата история и средновековна крепост.",
        km: 430
      }
    ];

    let currentIndex = -1;

    function generateRandomPlace() {
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * places.length);
      } while (newIndex === currentIndex);

      currentIndex = newIndex;
      const place = places[currentIndex];

      document.getElementById('placeTitle').innerText = place.title;
      document.getElementById('placeLocation').innerText = place.location;
      document.getElementById('placeImg').src = place.img;
      document.getElementById('placeDesc').innerText = place.desc;
      document.getElementById('distance').value = place.km;

      calculateFuel();
    }

    const distanceInput = document.getElementById('distance');
    const consumptionInput = document.getElementById('consumption');
    const priceInput = document.getElementById('price');
    const peopleInput = document.getElementById('people');
    const resultDiv = document.getElementById('totalResult');

    function calculateFuel() {
      const dist = parseFloat(distanceInput.value) || 0;
      const cons = parseFloat(consumptionInput.value) || 0;
      const price = parseFloat(priceInput.value) || 0;
      const people = parseInt(peopleInput.value) || 1;

      const totalLiters = (dist / 100) * cons;
      const totalCost = totalLiters * price;
      const costPerPerson = totalCost / people;

      resultDiv.innerHTML = `Общо за гориво: ${totalCost.toFixed(2)} лв. (${costPerPerson.toFixed(2)} лв. на човек)`;
    }

    distanceInput.addEventListener('input', calculateFuel);
    consumptionInput.addEventListener('input', calculateFuel);
    priceInput.addEventListener('input', calculateFuel);
    peopleInput.addEventListener('input', calculateFuel);

    generateRandomPlace();
  </script>
</body>
</html>
