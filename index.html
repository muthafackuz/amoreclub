<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BG Перли - Безкраен Генератор на Дестинации</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #10b981;
      --accent-hover: #059669;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      background: #020617;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent);
      text-decoration: none;
    }
    nav a {
      color: var(--text);
      text-decoration: none;
      margin-left: 1.5rem;
      font-weight: 500;
    }
    nav a.highlight {
      background: var(--accent);
      color: #000;
      padding: 0.5rem 1rem;
      border-radius: 6px;
    }
    .container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .generator-btn {
      display: block;
      width: 100%;
      padding: 1.2rem;
      font-size: 1.3rem;
      font-weight: bold;
      color: #000;
      background-color: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 2rem;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }
    .generator-btn:hover {
      background-color: var(--accent-hover);
    }
    .generator-btn:active {
      transform: scale(0.98);
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid var(--border);
      transition: opacity 0.3s ease-in-out;
    }
    .destination-img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 1rem;
      background-color: #020617;
    }
    .calculator {
      background: #020617;
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 1.5rem;
      margin-top: 1.5rem;
    }
    .calculator h3 {
      margin-top: 0;
      color: var(--accent);
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
      color: var(--text-muted);
    }
    input {
      width: 100%;
      padding: 0.6rem;
      background: #1e293b;
      border: 1px solid #475569;
      color: white;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .result {
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 1rem;
      padding: 1rem;
      background: #064e3b;
      border-radius: 6px;
      text-align: center;
      color: #34d399;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">BGПерли 🌲</a>
    <nav>
      <a href="index.html">Дестинации</a>
      <a href="salary.html" class="highlight">Калкулатор Заплата</a>
    </nav>
  </header>

  <div class="container">
    <button class="generator-btn" id="genBtn" onclick="fetchNewDestination()">🌐 ГЕНЕРИРАЙ СЛЕДВАЩА ИЗНЕНАДА (LIVE API)</button>

    <div class="card" id="placeCard">
      <h2 id="placeTitle">Зареждане на дестинация...</h2>
      <p id="placeLocation" style="color: var(--text-muted);">Автоматично генерирано от база данни</p>
      
      <img id="placeImg" src="" alt="Дестинация" class="destination-img">
      
      <p id="placeDesc">Натиснете бутона горе, за да изтеглите ново място, снимка и автоматичен маршрут!</p>

      <div class="calculator">
        <h3>🚗 Калкулатор за това пътуване</h3>
        
        <div class="form-group">
          <label>Приблиз. разстояние в двете посоки (км):</label>
          <input type="number" id="distance" value="150">
        </div>

        <div class="form-group">
          <label>Разход на колата (л/100км):</label>
          <input type="number" id="consumption" value="7" step="0.1">
        </div>

        <div class="form-group">
          <label>Цена на горивото (лв/литър):</label>
          <input type="number" id="price" value="2.65" step="0.01">
        </div>

        <div class="form-group">
          <label>Брой хора в колата:</label>
          <input type="number" id="people" value="3">
        </div>

        <div class="result" id="totalResult">
          Общо за гориво: 0.00 лв.
        </div>
      </div>
    </div>
  </div>

  <script>
    // Списък с ключови теми за природа, скали, планини и езера
    const topics = ['mountain', 'waterfall', 'canyon', 'forest', 'lake', 'castle', 'nature'];
    
    // Примерни локации за изненадващо генериране
    const titles = [
      "Мистично каньонно ждрело",
      "Планински водопад и панорама",
      "Езерно плато и природна екопътека",
      "Вековна крепост в скалите",
      "Скрита пещера и скални отвори",
      "Родопска панорамна площадка",
      "Речен завой и вековна гора"
    ];

    async function fetchNewDestination() {
      const card = document.getElementById('placeCard');
      const btn = document.getElementById('genBtn');
      
      btn.innerText = "⏳ Зареждане на живо...";
      card.style.opacity = 0.4;

      // Избиране на произволна тема
      const randomTopic = topics[Math.floor(Math.random() * topics.length)];
      const randomTitle = titles[Math.floor(Math.random() * titles.length)];
      
      // Генериране на ново произволно разстояние (между 80 км и 480 км)
      const randomKm = Math.floor(Math.random() * (480 - 80 + 1)) + 80;

      // Теглене на снимка в реално време от Unsplash Source API
      const timestamp = new Date().getTime(); // За да не кешира същата снимка
      const imgUrl = `https://source.unsplash.com/800x600/?${randomTopic}&sig=${timestamp}`;

      // Обновяване на съдържанието
      document.getElementById('placeTitle').innerText = randomTitle;
      document.getElementById('placeLocation').innerText = `Генерирана дестинация • Категория: ${randomTopic.toUpperCase()}`;
      document.getElementById('placeDesc').innerText = `Открийте невероятната красота на тази дестинация. Подходяща за уикенд разходка и бягство от градския шум.`;
      
      // Зареждаме снимката
      const imgTag = document.getElementById('placeImg');
      imgTag.src = imgUrl;

      // Обновяваме километрите в калкулатора
      document.getElementById('distance').value = randomKm;

      imgTag.onload = () => {
        card.style.opacity = 1;
        btn.innerText = "🌐 ГЕНЕРИРАЙ СЛЕДВАЩА ИЗНЕНАДА (LIVE API)";
        calculateFuel();
      };
      
      // За всеки случай, ако снимката забави:
      setTimeout(() => {
        card.style.opacity = 1;
        btn.innerText = "🌐 ГЕНЕРИРАЙ СЛЕДВАЩА ИЗНЕНАДА (LIVE API)";
        calculateFuel();
      }, 1000);
    }

    const distanceInput = document.getElementById('distance');
    const consumptionInput = document.getElementById('consumption');
    const priceInput = document.getElementById('price');
    const peopleInput = document.getElementById('people');
    const resultDiv = document.getElementById('totalResult');

    function calculateFuel() {
      const dist = parseFloat(distanceInput.value) || 0;
      const cons = parseFloat(consumptionInput.value) || 0;
      const price = parseFloat(priceInput.value) || 0;
      const people = parseInt(peopleInput.value) || 1;

      const totalLiters = (dist / 100) * cons;
      const totalCost = totalLiters * price;
      const costPerPerson = totalCost / people;

      resultDiv.innerHTML = `Общо за гориво: ${totalCost.toFixed(2)} лв. (${costPerPerson.toFixed(2)} лв. на човек)`;
    }

    distanceInput.addEventListener('input', calculateFuel);
    consumptionInput.addEventListener('input', calculateFuel);
    priceInput.addEventListener('input', calculateFuel);
    peopleInput.addEventListener('input', calculateFuel);

    // Зареждаме първоначална дестинация при отваряне
    fetchNewDestination();
  </script>
</body>
</html>
