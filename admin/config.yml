backend:
  name: git-gateway
  branch: main
  site_domain: amoreclub.netlify.app # Казва на Decap къде да търси Identity

media_folder: "images/destinations"
public_folder: "/images/destinations"

collections:
  - name: "destinations"
    label: "Дестинации"
    folder: "destinations"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Заглавие", name: "title", widget: "string" }
      - { label: "Дата на публикуване", name: "date", widget: "datetime" }
      - { label: "Главна снимка", name: "thumbnail", widget: "image" }
      - { label: "Кратко описание", name: "description", widget: "text" }
      - { label: "Местоположение / Област", name: "location", widget: "string" }
      - { label: "Пълно съдържание", name: "body", widget: "markdown" }
